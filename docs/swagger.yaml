openapi: 3.0.0
info:
  title: Warehouse Accounting API
  description: API for managing warehouse inventory and purchase processing.
  version: 1.0.0

paths:
  /api/inventory/{warehouse_id}:
    get:
      summary: Get warehouse inventory
      parameters:
        - name: warehouse_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              example:
                status: "success"
                data:
                  warehouse_id: 1
                  items:
                    - product_id: 101
                      quantity: 45
        '404':
          description: Warehouse not found

  /api/purchases:
    post:
      summary: Process a new purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: {type: integer}
                warehouse_id: {type: integer}
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: {type: integer}
                      quantity: {type: integer}
      responses:
        '201':
          description: Purchase created successfully
          content:
            application/json:
              example:
                status: "success"
                message: "Purchase completed successfully."
        '422':
          description: Validation error
          content:
            application/json:
              example:
                status: "error"
                message: "The given data was invalid."
                errors:
                  items.0.quantity: ["Insufficient stock for product 101."]
